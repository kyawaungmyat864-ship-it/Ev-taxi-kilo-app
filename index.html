
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Taxi Kilo</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 420px;
  margin: 30px auto;
  background: white;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 4px 15px #0002;
}
h2 { text-align: center; color: #087b50; }
label { font-weight: bold; }
input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin: 12px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 18px;
}
button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #087b50;
  color: white;
  font-size: 18px;
  margin-top: 10px;
}
.reset { background: #64748b; }
.result {
  background: #e8f7ef;
  padding: 18px;
  margin-top: 20px;
  border-radius: 12px;
  text-align: center;
}
.amount {
  font-size: 28px;
  color: #087b50;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="container">
<h2>🚕 EV TAXI KILO</h2>
<p style="text-align:center">ကိုယ်ပိုင် Taxi Kilo Calculator</p>

<label>ခရီးအကွာအဝေး (KM)</label>
<input type="number" id="km" placeholder="ကီလို ထည့်ပါ" min="0" step="any">

<label>စတက်ခ (ကျပ်)</label>
<input type="number" id="start" value="7000">

<label>၁ ကီလိုနှုန်း (ကျပ်)</label>
<input type="number" id="rate" value="1200">

<button onclick="calculate()">တွက်ချက်မယ်</button>
<button class="reset" onclick="resetForm()">ပြန်စမယ်</button>

<div class="result">
<p>ကျသင့်ငွေ စုစုပေါင်း</p>
<div class="amount" id="total">0 ကျပ်</div>
</div>
</div>

<script>
function calculate() {
  const km = Number(document.getElementById("km").value);
  const start = Number(document.getElementById("start").value);
  const rate = Number(document.getElementById("rate").value);

  if (document.getElementById("km").value === "" ||
      km < 0 || start < 0 || rate < 0) {
    alert("အချက်အလက် မှန်ကန်စွာ ထည့်ပါ");
    return;
  }

  const total = start + (km * rate);

  document.getElementById("total").textContent =
    Math.round(total).toLocaleString("en-US") + " ကျပ်";
}

function resetForm() {
  document.getElementById("km").value = "";
  document.getElementById("start").value = 7000;
  document.getElementById("rate").value = 1200;
  document.getElementById("total").textContent = "0 ကျပ်";
}
</script>
</body>
</html>
